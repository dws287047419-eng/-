<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BodyTrace"><meta name="theme-color" content="#4f6bed">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><title>BodyTrace 身体围度</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1d27;--sub:#6b7085;--pri:#4f6bed;--ok:#1f9d63;--warn:#d98a00;--bad:#d64545;--line:#e3e5ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12131a;--card:#1d1f2b;--tx:#eceef7;--sub:#9a9fb5;--pri:#8aa0ff;--line:#2d3040}}
:root[data-theme="dark"]{--bg:#12131a;--card:#1d1f2b;--tx:#eceef7;--sub:#9a9fb5;--pri:#8aa0ff;--line:#2d3040}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"PingFang SC","Noto Sans SC",system-ui,sans-serif;padding-bottom:76px}
main{max-width:560px;margin:0 auto;padding:16px}h1{font-size:22px;margin:4px 0 14px}h3{margin:0 0 8px;font-size:16px}
.card{background:var(--card);border-radius:20px;padding:14px 16px;margin-bottom:12px;border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sub{color:var(--sub);font-size:12px}
.big{font-size:26px;font-weight:700}.tag{font-size:11px;padding:2px 8px;border-radius:99px;color:#fff;margin-left:6px}
.ok{background:var(--ok)}.low{background:var(--warn)}.high{background:var(--bad)}
label{display:block;font-size:12px;color:var(--sub);margin-bottom:2px}
input,select,textarea{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:inherit}
button{background:var(--pri);color:#fff;border:0;border-radius:14px;padding:12px 18px;font:inherit;font-weight:600;width:100%;margin-top:8px}
button.g{background:var(--bg);color:var(--tx);border:1px solid var(--line)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav a{flex:1;text-align:center;padding:10px 0;font-size:12px;color:var(--sub)}nav a b{display:block;font-size:18px}nav a.on{color:var(--pri);font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}.chips span{white-space:nowrap;padding:6px 12px;border-radius:99px;border:1px solid var(--line);font-size:13px}.chips span.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.adv{border-left:4px solid var(--pri);padding-left:10px;margin:10px 0}.adv.low{border-color:var(--warn);background:none}.adv.high{border-color:var(--bad);background:none}
svg{width:100%;height:auto}.hide{display:none}
</style></head><body><main id="app"></main>
<nav id="nav"></nav>
<script>
const S={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let P=S.get('bt_p',null),R=S.get('bt_r',[]),tab='home',cur='weight';
const fat=(p)=>{const m=p.sex==='m',a=p.age;return m?(a<40?[11,21]:a<60?[12,23]:[14,25]):(a<40?[21,32]:a<60?[23,33]:[24,35])};
const fr=(m,f)=>p=>p.sex==='m'?[m[0]*p.h,m[1]*p.h]:[f[0]*p.h,f[1]*p.h];
let M=[
{k:'weight',n:'体重',u:'kg',r:p=>{const h=p.h/100;return[18.5*h*h,23.9*h*h]},lo:'偏轻:每日增加约300kcal热量,蛋白质1.6g/kg,每周3次抗阻训练。',hi:'偏重:每日少摄入300–500kcal,每周150分钟以上有氧加2–3次力量训练,目标每周减0.25–0.5kg。'},
{k:'fat',n:'体脂率',u:'%',r:fat,lo:'偏低:避免过度节食,保证足够脂肪与热量摄入,必要时咨询医生。',hi:'偏高:优先减脂——控制精制碳水与含糖饮料,增加蛋白质与力量训练保肌肉。'},
{k:'neck',n:'颈围',u:'cm',r:fr([.2,.23],[.17,.2]),lo:'偏细:可加入耸肩、面拉等颈肩训练。',hi:'偏粗:若同时腰围偏大,注意体脂与睡眠呼吸问题;若体脂正常多为肌肉发达。'},
{k:'chest',n:'胸围',u:'cm',r:fr([.52,.58],[.5,.56]),lo:'偏小:增加卧推、俯卧撑、飞鸟等胸背训练,并保证热量充足。',hi:'偏大:体脂偏高则先减脂;体脂正常则多为肌肉。'},
{k:'waist',n:'腰围',u:'cm',r:fr([.4,.5],[.4,.5]),lo:'偏小:一般无需干预,留意是否体重过轻。',hi:'偏大(腰高比>0.5,内脏脂肪风险):减少精制糖与酒精,每周多次快走/慢跑/HIIT,加强核心训练。'},
{k:'hip',n:'臀围',u:'cm',r:fr([.53,.58],[.54,.6]),lo:'偏小:增加深蹲、臀桥、硬拉等下肢训练。',hi:'偏大:体脂偏高则整体减脂,并配合下肢力量训练塑形。'},
{k:'arm',n:'上臂围(放松)',u:'cm',r:fr([.155,.19],[.135,.165]),lo:'偏细:增加弯举、臂屈伸、引体向上,每周每个肌群训练2次。',hi:'偏粗:体脂高则减脂;体脂正常则多为肌肉,保持即可。'},
{k:'forearm',n:'前臂围',u:'cm',r:fr([.14,.165],[.115,.14]),lo:'偏细:增加腕弯举、农夫行走、握力训练。',hi:'偏粗:多为肌肉或脂肪,结合体脂判断。'},
{k:'thigh',n:'大腿围(臀下)',u:'cm',r:fr([.3,.34],[.31,.36]),lo:'偏细:增加深蹲、箭步蹲、腿举,并保证蛋白质摄入。',hi:'偏粗:体脂高则整体减脂+有氧;体脂正常则多为肌肉。'},
{k:'calf',n:'小腿围',u:'cm',r:fr([.21,.235],[.2,.23]),lo:'偏细:增加提踵(直腿+屈膝各做)训练,每周2–3次。',hi:'偏粗:多为肌肉;若伴随水肿请注意盐分摄入并就医排查。'}];
M.splice(3,0,{k:'shoulder',n:'肩宽(两肩峰间)',u:'cm',r:fr([.23,.26],[.21,.24]),lo:'偏窄:增加侧平举、推举、引体向上以拓宽肩部。',hi:'偏宽:通常是骨架或肩部肌肉发达,无需调整。'});
M.push({k:'wrist',n:'腕围',u:'cm',r:fr([.09,.105],[.088,.1]),lo:'骨架偏小:增肌潜力受限,以力量循序渐进为主。',hi:'骨架偏大:属先天骨架,围度参考值可适当上浮。'});
M=M.flatMap(m=>['arm','forearm','thigh','calf'].includes(m.k)?[['_l','(左)'],['_r','(右)']].map(([a,b])=>({...m,k:m.k+a,n:m.n+b})):[m]);
R.forEach(r=>['arm','forearm','thigh','calf'].forEach(k=>{if(r[k]!=null){r[k+'_l']=r[k+'_r']=r[k];delete r[k]}}));
const $=s=>document.querySelector(s),today=()=>new Date().toISOString().slice(0,10);
const last=k=>{const a=R.filter(r=>r[k]!=null).sort((x,y)=>x.d<y.d?-1:1);return a};
function st(m,v){const[l,h]=m.r(P);return v<l?'low':v>h?'high':'ok'}
const lab={ok:'正常',low:'偏低',high:'偏高'};
const f1=x=>Math.round(x*10)/10;
function nav(){$('#nav').innerHTML=[['home','📊','概览'],['rec','✏️','记录'],['trend','📈','趋势'],['adv','💡','建议'],['set','⚙️','设置']].map(t=>`<a class="${tab===t[0]?'on':''}" onclick="go('${t[0]}')"><b>${t[1]}</b>${t[2]}</a>`).join('')}
function go(t){tab=t;render()}
function render(){nav();scrollTo(0,0);const a=$('#app');if(!P&&tab!=='set'){tab='set'}
a.innerHTML=({home,rec,trend,adv,set})[tab]();if(tab==='trend')draw()}
function home(){let h='<h1>身体概览</h1>';const w=last('waist').pop(),hp=last('hip').pop();
if(!R.length)return h+'<div class="card">还没有记录,先去「记录」页添加第一条数据吧。</div>';
h+='<div class="grid">';M.forEach(m=>{const a=last(m.k);if(!a.length)return;const v=a.at(-1)[m.k],s=st(m,v),[l,hh]=m.r(P);
const old=a.filter(x=>x.d<=new Date(Date.parse(a.at(-1).d)-2592e6).toISOString().slice(0,10)).pop()||(a.length>1?a[0]:null);
const dl=old&&old!==a.at(-1)?(v-old[m.k]):null;
h+=`<div class="card" style="margin:0" onclick="cur='${m.k}';go('trend')"><div class="sub">${m.n}</div><div class="big">${v}<span class="sub"> ${m.u}</span></div><span class="tag ${s}" style="margin:0">${lab[s]}</span><div class="sub">合理 ${f1(l)}–${f1(hh)}${dl!=null?` · ${dl>0?'↑':dl<0?'↓':'→'}${f1(Math.abs(dl))}`:''}</div></div>`});h+='</div>';
if(w&&hp){const r=w.waist/hp.hip,lim=P.sex==='m'?.9:.85;h+=`<div class="card" style="margin-top:12px"><h3>腰臀比 ${r.toFixed(2)}</h3><div class="sub">健康参考:${P.sex==='m'?'男性<0.90':'女性<0.85'}。当前${r<lim?'在健康范围内 ✅':'偏高,提示腹部脂肪堆积 ⚠️'}</div></div>`}
if(w)h+=`<div class="card"><h3>腰高比 ${(w.waist/P.h).toFixed(2)}</h3><div class="sub">理想 &lt;0.5;&gt;0.5 提示心代谢风险上升。</div></div>`;return h}
function rec(){const l=R.slice().sort((a,b)=>a.d<b.d?1:-1)[0]||{};return `<h1>新增记录</h1><div class="card"><label>日期</label><input type="date" id="d" value="${today()}">
<div class="grid" style="margin-top:10px">${M.map(m=>`<div><label>${m.n} (${m.u})</label><input type="number" step="0.1" inputmode="decimal" id="f_${m.k}" placeholder="${l[m.k]??''}"></div>`).join('')}</div>
<button onclick="save()">保存</button><div class="sub" style="margin-top:8px">提示:每次在同一时间(如早晨空腹)、同一侧、不收腹测量;可只填部分项目,同一日期会覆盖。</div></div>
<div class="card"><h3>历史</h3>${R.slice().sort((a,b)=>a.d<b.d?1:-1).slice(0,8).map(r=>`<div class="sub" style="display:flex;justify-content:space-between"><span>${r.d} · ${M.filter(m=>r[m.k]!=null).length}项</span><a style="color:var(--bad)" onclick="del('${r.d}')">删除</a></div>`).join('')||'<div class="sub">暂无</div>'}</div>`}
function save(){const d=$('#d').value;let r=R.find(x=>x.d===d);if(!r){r={d};R.push(r)}let n=0;M.forEach(m=>{const v=parseFloat($('#f_'+m.k).value);if(!isNaN(v)){r[m.k]=v;n++}});if(!n&&R.length&&Object.keys(r).length===1)R=R.filter(x=>x!==r);S.set('bt_r',R);go('home')}
function del(d){if(confirm('删除 '+d+' 的记录?')){R=R.filter(r=>r.d!==d);S.set('bt_r',R);render()}}
function trend(){return `<h1>趋势图</h1><div class="chips">${M.map(m=>`<span class="${m.k===cur?'on':''}" onclick="cur='${m.k}';render()">${m.n}</span>`).join('')}</div><div class="card" id="ch"></div>`}
function draw(){const m=M.find(x=>x.k===cur),a=last(cur),[l,h]=m.r(P);const el=$('#ch');
if(a.length<1){el.innerHTML='<div class="sub">该项暂无数据</div>';return}
const W=340,H=210,pl=36,pr=10,pt=12,pb=26,vs=a.map(x=>x[cur]),lo=Math.min(l,...vs),hi=Math.max(h,...vs),pad=(hi-lo)*.12||1,y0=lo-pad,y1=hi+pad;
const t0=Date.parse(a[0].d),t1=Date.parse(a.at(-1).d),X=d=>a.length<2||t1===t0?(pl+W-pr)/2:pl+(Date.parse(d)-t0)/(t1-t0)*(W-pl-pr),Y=v=>pt+(1-(v-y0)/(y1-y0))*(H-pt-pb);
let s=`<svg viewBox="0 0 ${W} ${H}"><rect x="${pl}" y="${Y(h)}" width="${W-pl-pr}" height="${Y(l)-Y(h)}" fill="#1f9d63" opacity=".15"/>`;
for(let i=0;i<4;i++){const v=y0+(y1-y0)*i/3;s+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${pl-4}" y="${Y(v)+4}" font-size="10" text-anchor="end" fill="var(--sub)">${f1(v)}</text>`}
s+=`<polyline fill="none" stroke="var(--pri)" stroke-width="2.5" points="${a.map(x=>X(x.d)+','+Y(x[cur])).join(' ')}"/>`;
a.forEach((x,i)=>{s+=`<circle cx="${X(x.d)}" cy="${Y(x[cur])}" r="4" fill="var(--pri)"/>`;if(i===0||i===a.length-1||a.length<6)s+=`<text x="${X(x.d)}" y="${Y(x[cur])-8}" font-size="10" text-anchor="middle" fill="var(--tx)">${x[cur]}</text>`});
s+=`<text x="${pl}" y="${H-6}" font-size="10" fill="var(--sub)">${a[0].d.slice(2)}</text><text x="${W-pr}" y="${H-6}" font-size="10" text-anchor="end" fill="var(--sub)">${a.at(-1).d.slice(2)}</text></svg>`;
const d=vs.length>1?vs.at(-1)-vs[0]:0;
el.innerHTML=`<h3>${m.n} (${m.u})</h3>${s}<div class="sub">绿色区域 = 按你的身高/年龄/性别推算的合理区间 ${f1(l)}–${f1(h)}${m.u}<br>共 ${vs.length} 条记录${vs.length>1?`,累计变化 ${d>0?'+':''}${f1(d)}${m.u}`:''}</div>`}
function adv(){let h='<h1>调整建议</h1>',n=0;M.forEach(m=>{const a=last(m.k);if(!a.length)return;const v=a.at(-1)[m.k],s=st(m,v);if(s==='ok')return;n++;const[l,hh]=m.r(P);
h+=`<div class="card"><h3>${m.n} ${v}${m.u}<span class="tag ${s}">${lab[s]}</span></h3><div class="sub">目标区间 ${f1(l)}–${f1(hh)}${m.u},${s==='low'?'还差':'需减少'}约 ${f1(s==='low'?l-v:v-hh)}${m.u}</div><div class="adv ${s}">${s==='low'?m.lo:m.hi}</div></div>`});
const w=last('weight'),wa=last('waist');if(w.length>1&&wa.length>1){const dw=w.at(-1).weight-w[0].weight,dc=wa.at(-1).waist-wa[0].waist;n++;h+=`<div class="card"><h3>趋势解读</h3><div class="adv">${dc<-1&&dw>-1?'腰围下降而体重变化不大:很可能在减脂增肌(身体重组),继续保持力量训练与高蛋白。':dc>1&&dw<=0?'体重没涨但腰围变大:可能肌肉流失或脂肪向腹部集中,建议增加抗阻训练并改善睡眠。':dw<0&&dc<0?'体重与腰围同步下降,方向正确,注意每周减重不超过体重的1%。':dw>0&&dc>1?'体重与腰围同时上升,建议检查饮食热量与活动量。':'整体变化平稳,继续保持并坚持每周记录。'}</div></div>`}
[['arm','上臂'],['forearm','前臂'],['thigh','大腿'],['calf','小腿']].forEach(([k,nm])=>{const l=last(k+'_l').pop(),r=last(k+'_r').pop();if(l&&r){const d=l[k+'_l']-r[k+'_r'];if(Math.abs(d)>=1.5){n++;h+=`<div class="card"><h3>${nm}左右不对称</h3><div class="adv low">${d>0?'左':'右'}侧比${d>0?'右':'左'}侧粗 ${f1(Math.abs(d))}cm。建议弱侧多做单侧训练(单臂哑铃弯举、保加利亚分腿蹲、单腿提踵),先练弱侧并多加1组。</div></div>`}}});
if(!n)h+='<div class="card">所有已记录项目都在合理区间 🎉 继续保持规律运动、充足睡眠与均衡饮食。</div>';
return h+'<div class="sub">区间为基于身高比例与年龄的通用参考,不能替代医生诊断;肌肉发达者的围度可能高于区间属正常。</div>'}
function set(){const p=P||{sex:'m',age:30,h:170};return `<h1>${P?'设置':'欢迎,先填写基本信息'}</h1><div class="card"><div class="grid"><div><label>性别</label><select id="sx"><option value="m" ${p.sex==='m'?'selected':''}>男</option><option value="f" ${p.sex==='f'?'selected':''}>女</option></select></div><div><label>年龄</label><input id="ag" type="number" value="${p.age}"></div><div style="grid-column:1/3"><label>身高 (cm)</label><input id="ht" type="number" value="${p.h}"></div></div><button onclick="sp()">保存</button></div>
<div class="card"><h3>数据备份</h3><textarea id="bk" rows="3" placeholder="导出后复制保存;导入时粘贴到这里"></textarea><button class="g" onclick="$('#bk').value=JSON.stringify({P,R});$('#bk').select();try{document.execCommand('copy')}catch(e){}">导出(复制)</button><button class="g" onclick="imp()">导入</button></div>
<div class="card"><h3>安装到手机</h3><div class="sub">部署后:Android Chrome 菜单 →「安装应用」;iPhone Safari 分享 →「添加到主屏幕」。数据仅保存在本机浏览器中。</div></div>`}
function sp(){P={sex:$('#sx').value,age:+$('#ag').value||30,h:+$('#ht').value||170};S.set('bt_p',P);go('home')}
function imp(){try{const o=JSON.parse($('#bk').value);if(o.P)P=o.P;if(Array.isArray(o.R))R=o.R;S.set('bt_p',P);S.set('bt_r',R);go('home')}catch(e){alert('数据格式不正确')}}
render();
try{if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js')}catch(e){}
</script></body></html>
